<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, interactive-widget=resizes-content" />
  <title>Nauka języka polskiego</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-light: #e2e4e7;
      --app-light: #f7f8f9;
      --text-light: #2d3748;
      --bar-empty-light: rgba(0, 0, 0, 0.15);
      
      --bg-dark: #121212;
      --app-dark: #1e1e1e;
      --text-dark: #e2e8f0;
      --bar-empty-dark: rgba(255, 255, 255, 0.2);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-light);
      color: var(--text-light);
      font-family: 'Segoe UI', Roboto, sans-serif;
      transition: background 0.3s, color 0.3s;
      display: flex;
      /* На мобильных прижимаем к верху */
      align-items: flex-start; 
      justify-content: center;
      padding-top: 20px;
    }

    /* На десктопах возвращаем центрирование */
    @media (min-width: 768px) {
      body {
        align-items: center;
        padding-top: 0;
      }
    }

    body.dark-mode {
      background: var(--bg-dark);
      color: var(--text-dark);
    }

    #app {
      width: 100%;
      max-width: 480px;
      margin: 16px;
      padding: 32px 24px;
      background: var(--app-light);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      transition: background 0.3s, border-color 0.3s;
      /* Чтобы приложение не сжималось по высоте */
      flex-shrink: 0; 
    }

    body.dark-mode #app {
      background: var(--app-dark);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid #2d2d2d;
    }

    h1, h2 { text-align: center; margin-top: 0; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }

    .card {
      background: rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: 0.2s;
    }

    body.dark-mode .card {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.08);
    }

    .card:hover { transform: translateY(-2px); background: rgba(0,0,0,0.08); }
    body.dark-mode .card:hover { background: rgba(255,255,255,0.1); }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      background: #cbd5e0;
      color: #1a202c;
      transition: 0.2s;
    }

    body.dark-mode button { background: #2d2d2d; color: #f7fafc; }
    button:hover { opacity: 0.9; }

    .btn-primary { background: #3182ce !important; color: white !important; }
    .btn-danger { background: #e53e3e !important; color: white !important; }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 2px solid #a0aec0;
      font-size: 1.1rem;
      margin-bottom: 16px;
      outline: none;
      background: white;
      color: black;
    }

    body.dark-mode input {
      background: #121212;
      border-color: #3d3d3d;
      color: white;
    }

    input:focus { border-color: #3182ce; }

    .progress { display: flex; gap: 6px; margin: 25px 0 15px; }
    .bar { 
      flex: 1; 
      height: 8px; 
      border-radius: 10px; 
      transition: all 0.3s;
      border: 1px solid rgba(0,0,0,0.1);
    }
    
    .bar-empty { background: var(--bar-empty-light); }
    body.dark-mode .bar-empty { background: var(--bar-empty-dark); }

    #modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: inherit;
      border-radius: 24px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .result-message { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
  </style>
</head>
<body id="mainBody">

<div id="app">
  <div id="ui-content"></div>

  <div id="modal-overlay">
    <h2 id="modal-text">Czy na pewno?</h2>
    <div style="display: flex; gap: 12px; width: 100%;">
      <button id="modal-cancel">Anuluj</button>
      <button id="modal-confirm" class="btn-danger">Tak</button>
    </div>
  </div>
</div>

<script>
  let lists = {};
  let loading = true;
  const praises = ["Świetnie!", "Brawo!", "Super!", "Dobrze!"];

  let state = {
    view: "menu",
    list: null,
    index: 0,
    result: null,
    answers: [],
    scores: JSON.parse(localStorage.getItem('wordScores') || '{}'),
    theme: localStorage.getItem('theme') || 'light'
  };

  function clearGlobalEvents() {
    window.onkeydown = null;
    window.onkeyup = null;
  }

  function showConfirm(text, onYes) {
    const overlay = document.getElementById('modal-overlay');
    document.getElementById('modal-text').textContent = text;
    overlay.style.display = 'flex';
    
    document.getElementById('modal-confirm').onclick = () => { onYes(); overlay.style.display = 'none'; };
    document.getElementById('modal-cancel').onclick = () => { overlay.style.display = 'none'; };
  }

  async function loadAllWordLists() {
    for (let i = 1; i <= 8; i++) {
      try {
        const res = await fetch(`${i}.txt`);
        if (res.ok) {
          const text = await res.text();
          const words = text.split('\n').map(line => {
            const parts = line.includes('=') ? line.split('=') : line.split('-');
            if (parts.length < 2) return null;
            return { pl: parts[0].trim().toLowerCase(), ru: parts[1].split(',').map(s => s.trim().toLowerCase()) };
          }).filter(x => x);
          if (words.length) lists[`Lista ${i}`] = words;
        }
      } catch (e) {}
    }
    if (!Object.keys(lists).length) {
      lists["Demo"] = [{ pl: "pies", ru: ["собака"] }, { pl: "kot", ru: ["кот"] }];
    }
    loading = false;
    render();
  }

  function render() {
    clearGlobalEvents();
    const body = document.getElementById('mainBody');
    state.theme === 'dark' ? body.classList.add('dark-mode') : body.classList.remove('dark-mode');
    localStorage.setItem('theme', state.theme);

    const container = document.getElementById('ui-content');
    
    if (loading) {
      container.innerHTML = `<h2>Ładowanie...</h2>`;
      return;
    }

    if (state.view === 'menu') {
      const listHtml = Object.keys(lists).map(name => `
        <div class="card" onclick="start('${name}')">
          <span>${name}</span>
          <span style="font-weight:bold;">${state.scores[name] || '-'}</span>
        </div>
      `).join('');
      container.innerHTML = `<h2>Listy słów</h2>${listHtml}
        <button onclick="state.view='settings';render()">Ustawienia</button>`;
    } 
    
    else if (state.view === 'settings') {
      container.innerHTML = `<h2>Ustawienia</h2>
        <button onclick="state.theme=(state.theme==='light'?'dark':'light');render()">Zmień motyw</button>
        <button onclick="confirmClear()" class="btn-danger">Resetuj wyniki</button>
        <button onclick="state.view='menu';render()" style="margin-top:20px;">Wróć</button>`;
    }

    else if (state.view === 'learn') {
      const words = lists[state.list];
      const word = words[state.index];
      const progress = words.map((_, i) => {
        let statusClass = 'bar-empty';
        let style = '';
        if (state.answers[i] === true) { statusClass = ''; style = 'background:#48bb78; border-color:#48bb78;'; }
        if (state.answers[i] === false) { statusClass = ''; style = 'background:#f56565; border-color:#f56565;'; }
        return `<div class="bar ${statusClass}" style="${style}"></div>`;
      }).join('');

      if (!state.result) {
        container.innerHTML = `
          <div style="text-align:center;">
            <h1 style="word-break:break-all;">${word.pl}</h1>
            <input id="inp" type="text" placeholder="Tłumaczenie..." autocomplete="off">
            <button onclick="check()" class="btn-primary">Sprawdź</button>
            <div class="progress">${progress}</div>
            <button onclick="confirmExit()" style="font-size:0.8rem; opacity:0.6;">Menu</button>
          </div>`;
        const input = document.getElementById('inp');
        input.focus();
        input.addEventListener('keydown', (e) => { 
          if(e.key === 'Enter') {
            e.preventDefault();
            check();
          }
        });
      } else {
        container.innerHTML = `
          <div style="text-align:center;">
            <h1>${word.pl}</h1>
            <div class="result-message" style="color:${state.result.ok ? '#48bb78' : '#f56565'}">${state.result.msg}</div>
            <div style="margin-bottom:20px; font-size:1.2rem;">${word.ru.join(', ')}</div>
            <button onclick="next()" class="btn-primary">Dalej (Enter)</button>
            <div class="progress">${progress}</div>
          </div>`;
        
        setTimeout(() => {
          window.onkeyup = (e) => {
            if (e.key === 'Enter') next();
          };
        }, 100);
      }
    }
  }

  function start(name) {
    state.list = name; state.index = 0; state.result = null;
    state.answers = new Array(lists[name].length).fill(undefined);
    state.view = 'learn'; render();
  }

  function check() {
    const input = document.getElementById('inp');
    if (!input) return;
    const val = input.value.trim().toLowerCase();
    if (!val) return;
    const ok = lists[state.list][state.index].ru.includes(val);
    state.answers[state.index] = ok;
    state.result = { ok, msg: ok ? praises[Math.floor(Math.random()*praises.length)] : 'Błąd' };
    render();
  }

  function next() {
    if (state.index + 1 < lists[state.list].length) {
      state.index++; state.result = null; render();
    } else {
      const score = ((state.answers.filter(a=>a).length / lists[state.list].length) * 5).toFixed(1);
      state.scores[state.list] = score;
      localStorage.setItem('wordScores', JSON.stringify(state.scores));
      state.view = 'menu'; render();
    }
  }

  function confirmExit() { showConfirm("Wyjść do menu?", () => { state.view = 'menu'; render(); }); }
  function confirmClear() { showConfirm("Usunąć wyniki?", () => { state.scores = {}; localStorage.removeItem('wordScores'); render(); }); }

  loadAllWordLists();


</script>
</body>
</html>
